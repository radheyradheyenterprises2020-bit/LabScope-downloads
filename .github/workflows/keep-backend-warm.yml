name: Keep backend warm

# Pings the Railway backend's /health every 10 minutes so it never sits idle
# long enough to go cold. A cold start made the register API take long enough
# for the website's register form to time out and fall through to its
# network-failure path.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LabScope API health endpoint
        run: |
          curl -sf -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            https://labscope-api-production.up.railway.app/health
